<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Reading &amp; study tracker</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#9634;</text></svg>">
</head>
<body>

<a class="skip" href="#view">Skip to content</a>

<header class="topbar">
  <div class="bar">
    <a class="wordmark" href="#/queue">
      <span class="mark" aria-hidden="true">§</span>
      <span>Reading &amp; study</span>
    </a>
    <nav id="nav" aria-label="Views"></nav>
    <div id="sync-status" class="sync" aria-live="polite"></div>
  </div>
</header>

<div id="banner" aria-live="polite"></div>

<main id="view" tabindex="-1"></main>

<footer class="foot">
  <p>
    Data lives in a private repository and is fetched at runtime; this page holds none of it.
    <a href="#/settings">Settings</a> · press <kbd>?</kbd> for keyboard shortcuts.
  </p>
</footer>

<noscript>
  <p style="padding:2rem">This tracker is a JavaScript application. It needs scripting enabled to fetch your data.</p>
</noscript>

<script type="module" src="js/app.js"></script>
<script>
// Boot guard. Not a module, so it runs even when the module graph fails to load.
//
// GitHub Pages serves with a ten-minute cache, so shortly after a deploy a
// browser can hold a stale copy of one file and a fresh copy of another. When
// the two disagree about an export, the entry module throws before rendering
// anything and the page is simply blank with an error only in the console.
// A blank page that says nothing is the worst possible failure for a tool you
// rely on daily, so say something.
(function () {
  var GRACE_MS = 6000;
  setTimeout(function () {
    if (window.__trackerBooted) return;
    var view = document.getElementById('view');
    if (!view || view.children.length) return;
    view.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'welcome';
    box.innerHTML =
      '<h1>The app did not start</h1>'
      + '<p>Most often this is a stale cached copy of one file alongside a fresh copy of '
      + 'another, right after an update. A hard refresh usually fixes it: '
      + '<kbd>Shift</kbd> and reload, or <kbd>Cmd</kbd><kbd>Shift</kbd><kbd>R</kbd>.</p>'
      + '<p class="hint">If it persists, the browser console will name the file. '
      + 'Your data is untouched — it lives in the private repository, not in this page.</p>';
    var btn = document.createElement('button');
    btn.className = 'primary';
    btn.textContent = 'Reload';
    btn.onclick = function () { location.reload(true); };
    box.appendChild(btn);
    view.appendChild(box);
  }, GRACE_MS);
})();
</script>
</body>
</html>
